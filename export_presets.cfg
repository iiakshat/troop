; Android debug preset for sideload testing. No secrets here: CI passes keystore details as env vars.
; v2: a Gradle build (the AdMob and Firebase plugins need it). build_apk.bat installs and patches the
; build template (tools/android_template.py). google-services.json stays out of git and out of the
; PCK; the Firebase plugin copies it from the project root into android/build/ at export time.
; package/unique_name is a debug placeholder; the release ID (permanent after the first Play upload)
; must be confirmed with the owner before a release preset is added.

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="config/*.json, config/levels/*.json, assets/city/*.json"
exclude_filter="tests/*, tools/*, art_src/*, docs/*, *.md, _local/*, android/*, google-services.json"
export_path="build/troop-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/compress_native_libraries=true
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.iiakshat.projecttroop"
package/name="Troop"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/access_network_state=true
permissions/internet=true
permissions/vibrate=true
firebase/android_config_file="res://google-services.json"
firebase/enable_core=true
firebase/enable_analytics=true
firebase/enable_crashlytics=false
firebase/enable_messaging=false
firebase/privacy_safe_defaults=true
