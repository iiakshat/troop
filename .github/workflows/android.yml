# Builds the game in the cloud so the laptop never needs Android Studio.
# Every push to `dev`: run tests, export a debug APK (download it from the run's Artifacts),
# then fast-forward `main` to the commit that just built. Nobody commits to main directly.

name: Android build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Install Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          cd /tmp
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          curl -fsSL -O "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -O "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          grep -E "Godot_v${GODOT_VERSION}-stable_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          mkdir -p ~/godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Keep only the Android templates; the full set is over 1 GB.
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" "templates/android_*" "templates/version.txt" -d tpl
          mv tpl/templates/* "$dest/"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      # Standard Android debug credentials (not secret); cached so every build installs as an update.
      - name: Restore debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/keys/debug.keystore
          key: troop-debug-keystore-v1

      - name: Create debug keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/keys
          keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android export
        run: |
          settings="[gd_resource type=\"EditorSettings\" format=3]

          [resource]
          export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"
          export/android/java_sdk_path = \"$JAVA_HOME\"
          export/android/debug_keystore = \"$HOME/keys/debug.keystore\"
          export/android/debug_keystore_user = \"androiddebugkey\"
          export/android/debug_keystore_pass = \"android\"
          "
          mkdir -p ~/.config/godot
          echo "$settings" > ~/.config/godot/editor_settings-4.tres
          echo "$settings" > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/keys/debug.keystore"
          mkdir -p build
          ~/godot/godot --headless --verbose --path . --export-debug "Android Debug" build/troop-debug.apk
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: troop-debug-apk
          path: build/troop-debug.apk
          retention-days: 14
          if-no-files-found: error

  promote:
    # A green build on dev is what main gets: fast-forward only, never a merge commit.
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to dev
        run: |
          git fetch origin main || true
          if git rev-parse --verify -q origin/main >/dev/null; then
            git merge-base --is-ancestor origin/main HEAD || { echo "main has commits dev lacks; refusing"; exit 1; }
          fi
          git push origin HEAD:refs/heads/main
